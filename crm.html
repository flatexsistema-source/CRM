 <p style="margin-top:14px"><button class="b" onclick="sv('${kind}',${id||0})">Salvar</button> <button class="b g" onclick="cls()">Cancelar</button> ${id&&ADM?`<button class="b r" style="float:right" onclick="del('${kind}',${id})">Excluir</button>`:''}</p></div>`}
async function sv(kind,id,force){const d=id?{id}:{...HID};FD[kind].forEach(([k,,t])=>{const v=$('#f_'+k).value;d[k]=t=='number'?+v||0:v});if(kind=='leads')d.fone=d.fone.replace(/\D/g,'');
 const r=await api('save',{kind,data:d,por:me,force});if(r.dup){if(confirm('Este telefone já existe: '+r.dup.empresa+' ('+(r.dup.dono||'sem vendedor')+').\nSalvar mesmo assim?'))return sv(kind,id,1);return}
 if(r.err)return alert(r.err);cls();V=0;load()}
async function del(kind,id){if(confirm('Excluir este registro?')){await api('del',{id});cls();V=0;load()}}
function csv(t){const s=t.indexOf(';')>-1&&t.indexOf(';')<t.indexOf('\n')?';':',',R=[];let r=[],c='',q=0;for(const ch of t+'\n'){if(ch=='"')q=!q;else if(!q&&(ch==s||ch=='\n')){r.push(c.trim());c='';if(ch=='\n'){if(r.some(x=>x))R.push(r);r=[]}}else if(ch!='\r')c+=ch}return R}
function imp(el){const rd=new FileReader();rd.onload=async()=>{const[h,...B]=csv(rd.result),ix=re=>h.findIndex(x=>re.test(x)),i={empresa:ix(/empresa|nome|cliente/i),cidade:ix(/cidade/i),fone:ix(/fone|tel|whats|cel/i),contato:ix(/contato/i)};
 if(i.empresa<0||i.fone<0)return alert('O CSV precisa ter cabeçalho com colunas Empresa e Telefone (e opcionalmente Cidade e Contato).');
 const r=await api('import',{rows:B.map(x=>({empresa:x[i.empresa],cidade:x[i.cidade]||'',fone:x[i.fone]||'',contato:x[i.contato]||''}))});alert(r.novos+' novos leads importados. '+r.duplicados+' ignorados (telefone repetido ou sem nome).');V=0;load()};rd.readAsText(el.files[0])}
(async()=>{
 if(DEMO){W=demoW('ana');demoBanner();await conf();await abrir();setInterval(load,5000);return}

 sb.auth.onAuthStateChange(ev=>{if(ev=='PASSWORD_RECOVERY'){const p=prompt('Digite a nova senha (mínimo 8 caracteres):');if(p&&p.length>=8)sb.auth.updateUser({password:p}).then(()=>alert('Senha alterada.'))}});
